name: Clean up old releases

# One-time clean-up: deletes the releases listed in .github/cleanup-releases.txt (old APK copies).
on:
  push:
    branches: [main]
    paths: [".github/cleanup-releases.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete the listed releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r TAG; do
            [ -z "$TAG" ] && continue
            if gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag; then echo "deleted $TAG"; else echo "not found: $TAG"; fi
          done < .github/cleanup-releases.txt
