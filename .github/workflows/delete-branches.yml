name: Delete branches

# One-time tidy-up: deletes the branches given when it is started by hand.
on:
  workflow_dispatch:
    inputs:
      branches:
        description: Branch names, separated by spaces
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the branches
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCHES: ${{ inputs.branches }}
        run: |
          for B in $BRANCHES; do
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$B" >/dev/null; then echo "deleted $B"; else echo "not found: $B"; fi
          done
